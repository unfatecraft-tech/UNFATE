<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNFATE — 우리끼리 보는 영상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #0f0f0f;
    --text-sub: #606060;
    --border: #e5e5e5;
    --hover: #f2f2f2;
    --accent: #ff3b30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* setup banner */
  .setup-banner {
    display: none;
    background: #fff4e5; border-bottom: 1px solid #f0d9b5;
    padding: 14px 24px; font-size: 0.85rem; color: #7a4a00;
  }
  .setup-banner.show { display: block; }

  header {
    display: flex; align-items: center; gap: 24px; padding: 12px 24px;
    border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  .logo { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em; white-space: nowrap; }
  .search { flex: 1; max-width: 560px; margin: 0 auto; display: flex; }
  .search input {
    flex: 1; padding: 9px 16px; border: 1px solid var(--border);
    border-radius: 20px 0 0 20px; font-size: 0.9rem; outline: none;
  }
  .search input:focus { border-color: #999; }
  .search button {
    width: 48px; border: 1px solid var(--border); border-left: none;
    background: var(--hover); border-radius: 0 20px 20px 0; cursor: pointer; font-size: 1rem;
  }
  .header-right { display: flex; align-items: center; gap: 14px; margin-left: auto; }
  .upload-btn {
    display: flex; align-items: center; gap: 6px; background: var(--text); color: #fff;
    border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; padding: 9px 16px; border-radius: 18px;
  }
  .upload-btn:hover { opacity: 0.85; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #4b6bff, #ff3b90); flex-shrink: 0; }

  .chips { display: flex; gap: 10px; padding: 14px 24px; overflow-x: auto; border-bottom: 1px solid var(--border); }
  .chip { white-space: nowrap; padding: 7px 14px; border-radius: 8px; background: var(--hover); border: none; font-size: 0.85rem; font-weight: 500; cursor: pointer; }
  .chip.active { background: var(--text); color: #fff; }

  .status-bar { padding: 10px 24px; font-size: 0.82rem; color: var(--text-sub); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px 16px; padding: 8px 24px 24px; }
  .card { cursor: pointer; }
  .thumb {
    position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center;
  }
  .thumb .play-badge { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
  .thumb .badge-cat { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.65); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; }
  .thumb .del-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.55); color: #fff; border: none; width: 24px; height: 24px; border-radius: 50%; font-size: 0.75rem; cursor: pointer; }
  .thumb .del-btn:hover { background: rgba(255,59,48,0.85); }

  .meta { display: flex; gap: 10px; margin-top: 10px; }
  .meta .avatar { width: 36px; height: 36px; }
  .meta-text h3 { font-size: 0.92rem; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta-text .channel { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; }
  .meta-text .stats { font-size: 0.8rem; color: var(--text-sub); }

  .empty-state { padding: 80px 24px; text-align: center; color: var(--text-sub); }
  .empty-state .big { font-size: 1.1rem; color: var(--text); font-weight: 600; margin-bottom: 8px; }
  .empty-state button { margin-top: 18px; }

  footer { padding: 28px 24px 40px; font-size: 0.78rem; color: var(--text-sub); text-align: center; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 26px; width: 100%; max-width: 420px; }
  .modal h2 { font-size: 1.15rem; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; }
  .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; font-family: inherit; }
  .field .hint { font-size: 0.75rem; color: var(--text-sub); margin-top: 5px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button { flex: 1; padding: 11px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
  .btn-cancel { background: var(--hover); color: var(--text); }
  .btn-submit { background: var(--text); color: #fff; }
  .error-msg { color: var(--accent); font-size: 0.8rem; margin-top: 8px; display: none; }

  .player-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .player-overlay.open { display: flex; }
  .player-box { width: 100%; max-width: 900px; }
  .player-frame { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
  .player-frame iframe, .player-frame video { width: 100%; height: 100%; border: none; }
  .player-info { color: #fff; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
  .player-close { background: rgba(255,255,255,0.15); color: #fff; border: none; padding: 8px 16px; border-radius: 18px; cursor: pointer; font-size: 0.85rem; }
  .external-link { color: #fff; text-decoration: underline; font-size: 0.85rem; }

  @media (max-width: 640px) {
    .logo { font-size: 1.05rem; }
    .search { display: none; }
    header { gap: 12px; }
  }
</style>
</head>
<body>

<div class="setup-banner" id="setupBanner">
  ⚠️ 아직 Firebase 설정이 안 되어 있어요. 이 파일 맨 아래 &lt;script&gt; 안의 <code>firebaseConfig</code> 값을 본인 Firebase 프로젝트 값으로 바꿔주세요.
</div>

<header>
  <div class="logo">UNFATE</div>
  <div class="search">
    <input type="text" id="searchInput" placeholder="클립 검색">
    <button onclick="filterAndRender()">🔍</button>
  </div>
  <div class="header-right">
    <button class="upload-btn" onclick="openAddModal()">＋ 클립 추가</button>
    <div class="avatar"></div>
  </div>
</header>

<div class="chips" id="chips">
  <button class="chip active" data-cat="전체">전체</button>
  <button class="chip" data-cat="웃긴 거">웃긴 거</button>
  <button class="chip" data-cat="일상">일상</button>
  <button class="chip" data-cat="게임">게임</button>
  <button class="chip" data-cat="여행">여행</button>
  <button class="chip" data-cat="먹방">먹방</button>
</div>

<div class="status-bar" id="statusBar">불러오는 중...</div>
<div class="grid" id="grid"></div>

<footer>UNFATE — 링크로 들어온 친구는 누구나 클립을 올리고 지울 수 있어요. 계정/로그인은 없어요.</footer>

<div class="overlay" id="addOverlay">
  <div class="modal">
    <h2>클립 추가하기</h2>
    <div class="field">
      <label>제목</label>
      <input type="text" id="inputTitle" placeholder="예: 계단에서 대참사">
    </div>
    <div class="field">
      <label>올리는 사람</label>
      <input type="text" id="inputUploader" placeholder="닉네임">
    </div>
    <div class="field">
      <label>영상 링크</label>
      <input type="text" id="inputUrl" placeholder="유튜브 / 구글드라이브 / mp4 링크">
      <div class="hint">유튜브, 구글 드라이브 공유 링크는 바로 재생돼요. 그 외 링크는 새 탭으로 열려요.</div>
    </div>
    <div class="field">
      <label>카테고리</label>
      <select id="inputCategory">
        <option>웃긴 거</option>
        <option>일상</option>
        <option>게임</option>
        <option>여행</option>
        <option>먹방</option>
      </select>
    </div>
    <div class="error-msg" id="formError">제목과 영상 링크는 꼭 입력해주세요.</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">취소</button>
      <button class="btn-submit" onclick="submitClip()">올리기</button>
    </div>
  </div>
</div>

<div class="player-overlay" id="playerOverlay">
  <div class="player-box">
    <div class="player-frame" id="playerFrame"></div>
    <div class="player-info">
      <span id="playerTitle"></span>
      <button class="player-close" onclick="closePlayer()">닫기 ✕</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   1) 아래 firebaseConfig 값을 본인 Firebase 프로젝트 값으로 교체하세요.
      Firebase 콘솔 > 프로젝트 설정 > 내 앱 > SDK 설정 및 구성 에서 복사할 수 있어요.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCNEIvx2uxCBdHxUdFqyoMbzrTxYmCbWYM",
  authDomain: "unfate-a82ea.firebaseapp.com",
  projectId: "unfate-a82ea",
  storageBucket: "unfate-a82ea.firebasestorage.app",
  messagingSenderId: "731136795033",
  appId: "1:731136795033:web:5fdb0e2612120e4d8fb308"
};

const isConfigured = !firebaseConfig.apiKey.includes('PASTE_');
if (!isConfigured) {
  document.getElementById('setupBanner').classList.add('show');
  document.getElementById('statusBar').textContent = '';
}

let db = null;
if (isConfigured) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}

let allClips = [];
let activeCategory = '전체';
const palette = ['#ffd9c0,#ffb199','#c9e4ff,#9dc9ff','#d6f5d6,#a8e6a8','#f0d6ff,#d9a8ff','#fff2b8,#ffe08a','#d0d0f0,#a8a8e6'];

function gradientFor(index) {
  const pair = palette[index % palette.length].split(',');
  return `linear-gradient(160deg, ${pair[0]}, ${pair[1]})`;
}

function timeAgo(ts) {
  const diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60) return '방금';
  if (diff < 3600) return Math.floor(diff/60) + '분 전';
  if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
  return Math.floor(diff/86400) + '일 전';
}

function parseVideo(url) {
  const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
  if (yt) return { type: 'youtube', embed: `https://www.youtube.com/embed/${yt[1]}`, thumb: `https://img.youtube.com/vi/${yt[1]}/hqdefault.jpg` };
  const drive = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (drive) return { type: 'drive', embed: `https://drive.google.com/file/d/${drive[1]}/preview`, thumb: null };
  if (/\.(mp4|webm|mov)(\?.*)?$/i.test(url)) return { type: 'direct', embed: url, thumb: null };
  return { type: 'external', embed: url, thumb: null };
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* Firestore 실시간 구독: 누군가 클립을 올리거나 지우면 모든 접속자 화면에 즉시 반영됨 */
if (isConfigured) {
  db.collection('clips').orderBy('addedAt', 'desc').onSnapshot((snapshot) => {
    allClips = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    document.getElementById('statusBar').textContent = allClips.length > 0 ? `클립 ${allClips.length}개` : '';
    filterAndRender();
  }, (err) => {
    document.getElementById('statusBar').textContent = '연결에 실패했어요: ' + err.message;
  });
}

function filterAndRender() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = allClips.slice();
  if (activeCategory !== '전체') list = list.filter(c => c.category === activeCategory);
  if (q) list = list.filter(c => c.title.toLowerCase().includes(q) || c.uploader.toLowerCase().includes(q));
  render(list);
}

function render(list) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!isConfigured) {
    grid.innerHTML = `<div class="empty-state"><div class="big">설정이 필요해요</div><div>위 안내대로 Firebase 설정을 먼저 완료해주세요.</div></div>`;
    return;
  }
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <div class="big">아직 올라온 클립이 없어요</div>
      <div>친구들에게 링크를 공유하고 첫 클립을 올려보세요.</div>
      <button class="upload-btn" onclick="openAddModal()">＋ 클립 추가</button>
    </div>`;
    return;
  }
  list.forEach((clip, i) => {
    const info = parseVideo(clip.url);
    const card = document.createElement('div');
    card.className = 'card';
    const thumbStyle = info.thumb ? `background-image:url('${info.thumb}')` : `background:${gradientFor(i)}`;
    card.innerHTML = `
      <div class="thumb" style="${thumbStyle}">
        <span class="badge-cat">${clip.category}</span>
        <button class="del-btn" title="삭제">✕</button>
        <div class="play-badge">▶</div>
      </div>
      <div class="meta">
        <div class="avatar"></div>
        <div class="meta-text">
          <h3>${escapeHtml(clip.title)}</h3>
          <div class="channel">${escapeHtml(clip.uploader)}</div>
          <div class="stats">${timeAgo(clip.addedAt)}</div>
        </div>
      </div>`;
    card.querySelector('.thumb').addEventListener('click', (e) => {
      if (e.target.closest('.del-btn')) return;
      openPlayer(clip, info);
    });
    card.querySelector('.del-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteClip(clip.id);
    });
    grid.appendChild(card);
  });
}

async function deleteClip(id) {
  if (!confirm('이 클립을 삭제할까요?')) return;
  try { await db.collection('clips').doc(id).delete(); }
  catch (e) { alert('삭제에 실패했어요: ' + e.message); }
}

function openAddModal() {
  if (!isConfigured) { alert('먼저 Firebase 설정을 완료해주세요.'); return; }
  document.getElementById('formError').style.display = 'none';
  document.getElementById('inputTitle').value = '';
  document.getElementById('inputUploader').value = '';
  document.getElementById('inputUrl').value = '';
  document.getElementById('addOverlay').classList.add('open');
}
function closeAddModal() { document.getElementById('addOverlay').classList.remove('open'); }

async function submitClip() {
  const title = document.getElementById('inputTitle').value.trim();
  const uploader = document.getElementById('inputUploader').value.trim() || '익명';
  const url = document.getElementById('inputUrl').value.trim();
  const category = document.getElementById('inputCategory').value;
  if (!title || !url) {
    document.getElementById('formError').style.display = 'block';
    return;
  }
  try {
    await db.collection('clips').add({ title, uploader, url, category, addedAt: Date.now() });
    closeAddModal();
  } catch (e) {
    alert('저장에 실패했어요: ' + e.message);
  }
}

function openPlayer(clip, info) {
  const frame = document.getElementById('playerFrame');
  document.getElementById('playerTitle').textContent = `${clip.title} · ${clip.uploader}`;
  if (info.type === 'youtube' || info.type === 'drive') {
    frame.innerHTML = `<iframe src="${info.embed}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  } else if (info.type === 'direct') {
    frame.innerHTML = `<video src="${info.embed}" controls autoplay></video>`;
  } else {
    frame.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;color:#fff;">
      <div>이 링크는 바로 재생할 수 없어요.</div>
      <a class="external-link" href="${clip.url}" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
    </div>`;
  }
  document.getElementById('playerOverlay').classList.add('open');
}
function closePlayer() {
  document.getElementById('playerOverlay').classList.remove('open');
  document.getElementById('playerFrame').innerHTML = '';
}

document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    activeCategory = c.dataset.cat;
    filterAndRender();
  });
});
document.getElementById('searchInput').addEventListener('input', filterAndRender);

render([]);
</script>

</body>
</html>
